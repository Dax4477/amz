<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Mastery Practice Lite</title>
<style>
*{box-sizing:border-box} :root{--bg:#f5f7fd;--panel:#fff;--ink:#121a31;--muted:#6b768b;--line:#e1e6ef;--blue:#2869f7;--violet:#7048ff;--green:#0d9f6e;--red:#d92d20;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 16px;border-bottom:1px solid var(--line);background:#fffffff2;backdrop-filter:blur(14px)}
.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font-weight:900}
.brand{font-weight:900}.title{min-width:0;flex:1}.title b,.title span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title span{color:var(--muted);font-size:.7rem}
.pill,.btn{min-height:42px;padding:8px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#26344d;font-weight:850}.btn.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.wrap{width:min(1120px,calc(100% - 24px));margin:auto;padding:24px 0 70px}.hero,.card{border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 14px 40px #2b376010}
.hero{padding:26px;background:radial-gradient(circle at 100% 0,#7048ff20,transparent 280px),linear-gradient(135deg,#fff,#f5f6ff)}.hero h1{margin:6px 0 10px;font-size:clamp(2rem,5vw,4rem);line-height:1;letter-spacing:-.05em}.hero p{max-width:720px;margin:0;color:var(--muted);line-height:1.6}.eyebrow{color:#4f46e5;font-size:.68rem;font-weight:950;letter-spacing:.1em;text-transform:uppercase}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.mode{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}.mode h2{margin:10px 0 6px}.mode p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.5}.mode .btn{margin-top:13px}
.card{margin-top:14px;padding:18px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}.head h2{margin:0}.head p{margin:3px 0 0;color:var(--muted);font-size:.76rem}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.level{min-height:68px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.level b,.level span{display:block}.level span{margin-top:4px;color:var(--muted);font-size:.66rem}.level.pass{background:#eaf9f3;border-color:#9edfc6}.level.current{background:#eef0ff;border-color:#8e9af7}.level.locked{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:.72rem;font-weight:850;color:#4d5870}.field input{min-height:44px;padding:9px 11px;border:1px solid #dce2ec;border-radius:11px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.help{color:var(--muted);font-size:.72rem;line-height:1.5}
.workspace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.75fr) 270px;min-height:calc(100dvh - 62px)}.pane,.side{min-width:0;background:#fff}.pane{border-right:1px solid var(--line)}.side{background:#f8fafc}.panehead{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.76rem}.progress{height:4px;background:#edf0f5}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet))}
.qbox{padding:24px 24px 95px}.qlabel{color:#4f46e5;font-size:.65rem;font-weight:950;letter-spacing:.1em;text-transform:uppercase}.qtext{margin:8px 0 15px;font-size:clamp(1.2rem,2.2vw,1.9rem);font-weight:820;line-height:1.45;white-space:pre-line}.qimg{max-width:100%;max-height:52vh;margin:10px 0;border:1px solid var(--line);border-radius:12px;object-fit:contain}
.abox{padding:17px 17px 95px}.answer-title{display:flex;justify-content:space-between;margin-bottom:10px;color:#48556b;font-size:.76rem;font-weight:850}.opts{display:grid;gap:9px}.opt{display:grid;grid-template-columns:32px 22px 1fr;align-items:center;gap:9px;min-height:56px;padding:10px;border:1px solid #dbe2ec;border-radius:13px;background:#fff;text-align:left}.opt.sel{background:#eef0ff;border-color:#6f7df0}.opt.good{background:#eaf9f3;border-color:#63c89f}.opt.bad{background:#fff0ef;border-color:#ff938a}.letter{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#eef0ff;color:#4f46e5;font-weight:900}.radio{width:17px;height:17px;border:2px solid #cbd4e1;border-radius:50%}.opt.sel .radio{border:5px solid #6675ed}.feedback{margin-top:10px;padding:11px;border-radius:11px;font-size:.78rem}.feedback.good{background:#eaf9f3;color:#08764f}.feedback.bad{background:#fff0ef;color:#a92218}
.sideTop{padding:14px;border-bottom:1px solid var(--line)}.sideActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.mini{display:flex;gap:10px;margin-top:10px;color:#5c687d;font-size:.7rem}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px}.pq{min-height:38px;border:1px solid #ccd5e2;border-radius:9px;background:#fff;font-weight:850}.pq.cur{box-shadow:inset 0 0 0 2px #4f6cf5}.pq.answered{background:#eaf9f3;border-color:#6dcca6}.pq.marked{background:#f2edff;border-color:#b79bff}
.bottom{position:fixed;left:0;right:270px;bottom:0;z-index:25;display:flex;justify-content:space-between;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fffffff5;backdrop-filter:blur(12px)}
.result{width:min(900px,calc(100% - 24px));margin:auto;padding:26px 0 70px}.resultHero{padding:24px;border-radius:20px;background:linear-gradient(135deg,#23346f,#4f55e9);color:#fff}.resultHero h1{margin:5px 0;font-size:3rem}.resultHero p{margin:0;color:#dce1ff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.stat{padding:12px;border-radius:12px;background:#ffffff1c}.stat b,.stat span{display:block}.stat span{font-size:.65rem;color:#dce1ff}.review{display:grid;gap:8px}.reviewItem{padding:13px;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;background:#fff}.reviewItem.good{border-left-color:var(--green)}.reviewItem h3{margin:0 0 7px;font-size:.88rem;white-space:pre-line}.reviewItem p{margin:3px 0;color:#536078;font-size:.74rem}
.mobileTools{display:none}
@media(max-width:940px){.workspace{grid-template-columns:1fr}.side{display:none}.pane{border-right:0}.bottom{right:0}.mobileTools{position:sticky;top:62px;z-index:22;display:grid;grid-template-columns:1fr 1fr 42px;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);background:#f7f9fdf3}.mobileTools button{min-height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:800}.sheetBack{position:fixed;inset:0;z-index:80;background:#0f172a66}.sheet{position:fixed;z-index:81;left:0;right:0;bottom:0;max-height:70dvh;overflow:auto;padding:22px 14px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#fff}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead button{width:36px;height:36px;border:0;border-radius:9px;background:#f1f3f7}}
@media(max-width:700px){.top{min-height:58px;padding:7px 9px}.brand{display:none}.wrap{width:calc(100% - 18px);padding-top:14px}.hero{padding:17px}.hero h1{font-size:2rem}.modes{grid-template-columns:1fr}.levels{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.mobileTools{top:58px}.qbox{padding:17px 14px 18px}.abox{padding:13px 13px 90px}.qtext{font-size:1.15rem}.opt{grid-template-columns:30px 20px 1fr;min-height:52px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card">Loading questions…</div></div></div>
<script>
(() => {
'use strict';
const INDEX_FILE='./question-bank/index.json', LEVEL=10, KEY='mastery-lite:';
const app=document.getElementById('app');
const S={bank:null,mode:null,qs:[],ans:[],mark:new Set(),cur:0,score:0,locked:new Set(),level:0,sec:0,timer:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
const unlocked=()=>Math.max(0,Number(localStorage.getItem(KEY+S.bank.code)||0)); const setUnlocked=n=>localStorage.setItem(KEY+S.bank.code,String(n));
const top=(sub,extra='')=>`<header class="top"><div class="logo">M</div><div class="brand">ammus practice</div><div class="title"><b>${esc(S.bank?.title||'Practice')}</b><span>${esc(sub)}</span></div>${extra}<button class="pill" data-home>Exit</button></header>`;
function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function normalize(q,i){return{id:q.id??i+1,question:String(q.question??''),options:(q.options||[]).map(String),answer:String(q.answer??''),explanation:String(q.explanation??''),image:q.image?String(q.image):''}}
async function load(){try{const r=await fetch(INDEX_FILE,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!d||!Array.isArray(d.booklets))throw Error('question-bank/index.json must contain a booklets array');S.index=d;booklets()}catch(e){app.innerHTML=`<main class="wrap"><div class="card"><h2>Could not load booklet index</h2><p class="help">${esc(e.message)}</p><p class="help">Use GitHub Pages or a local web server; file:// may block JSON loading.</p></div></main>`}}
async function openBooklet(meta){try{app.innerHTML=`<main class="wrap"><div class="card">Loading booklet…</div></main>`;const r=await fetch('./question-bank/'+meta.file,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.questions))throw Error('Booklet JSON must contain a questions array');S.bank={code:String(d.code||meta.id||meta.file),title:String(d.title||meta.title||'Practice Set'),category:String(d.category||meta.category||''),description:String(d.description||meta.description||''),questions:d.questions.map(normalize)};home()}catch(e){app.innerHTML=`<main class="wrap"><div class="card"><h2>Could not load booklet</h2><p class="help">${esc(e.message)}</p><button class="btn" data-back-booklets>Back to booklets</button></div></main>`;document.querySelector('[data-back-booklets]').onclick=booklets}}
function booklets(){stop();const items=S.index.booklets||[];const cards=items.map((b,i)=>`<button class="mode" type="button" data-booklet="${i}" style="width:100%;text-align:left"><div class="eyebrow">${esc(b.category||'Practice')}</div><h2>${esc(b.title||b.id||'Booklet')}</h2><p>${esc(b.description||'Open this practice booklet.')}</p><div class="help" style="margin-top:10px">${b.question_count?esc(b.question_count)+' questions':''}</div></button>`).join('');app.innerHTML=`<header class="top"><div class="logo">M</div><div class="brand">AMMUS PRACTICE</div><div class="title"><b>Practice Booklets</b><span>Choose a booklet to begin</span></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Personal practice library</div><h1>Choose a booklet.</h1><p>Each booklet is a normal JSON file. Add as many as you want.</p></section><section class="card"><div class="head"><div><h2>Booklets</h2><p>${items.length} available</p></div></div><div class="modes">${cards||'<div class="help">No booklets added yet.</div>'}</div></section></main>`;document.querySelectorAll('[data-booklet]').forEach(b=>b.onclick=()=>openBooklet(items[+b.dataset.booklet]))}
function home(){stop();app.innerHTML=`${top('GitHub Pages edition')}<main class="wrap"><section class="hero"><div class="eyebrow">${esc(S.bank.category||'Personal practice')}</div><h1>${esc(S.bank.title)}</h1><p>${esc(S.bank.description||'Choose Mastery Mode for level-by-level learning or Timed Mode for a custom mock test.')}</p><div class="modes"><article class="mode"><h2>🏆 Mastery Mode</h2><p>${LEVEL}-question levels. Get 100% to unlock the next level. Progress stays in this browser.</p><button class="btn primary" data-mastery>Choose level</button></article><article class="mode"><h2>⏱ Timed Mode</h2><p>Choose number of questions and minutes. Questions and options are shuffled.</p><button class="btn primary" data-timed>Set up test</button></article></div></section><section class="card"><div class="head"><div><h2>Question bank</h2><p>${S.bank.questions.length} questions</p></div><button class="btn" data-booklets>Change booklet</button></div><div class="help">This booklet is loaded from its own JSON file.</div></section></main>`;document.querySelector('[data-mastery]').onclick=levels;document.querySelector('[data-timed]').onclick=timedSetup;document.querySelector('[data-booklets]').onclick=booklets;document.querySelector('[data-home]').onclick=home}
function levels(){const total=Math.ceil(S.bank.questions.length/LEVEL),u=Math.min(unlocked(),total-1);let h='';for(let i=0;i<total;i++){const pass=i<u,cur=i===u,lock=i>u;h+=`<button class="level ${pass?'pass':''} ${cur?'current':''} ${lock?'locked':''}" data-level="${i}" ${lock?'disabled':''}><b>${pass?'✓ ':''}Level ${i+1}</b><span>${pass?'Passed':cur?'Current':'Locked'}</span></button>`}app.innerHTML=`${top('Mastery Mode')}<main class="wrap"><section class="card"><div class="head"><div><h2>Choose a level</h2><p>100% unlocks the next level.</p></div><button class="btn" data-reset>Reset</button></div><div class="levels">${h}</div></section></main>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startMastery(+b.dataset.level));document.querySelector('[data-reset]').onclick=()=>{if(confirm('Reset Mastery progress?')){setUnlocked(0);levels()}};document.querySelector('[data-home]').onclick=home}
function timedSetup(){const max=S.bank.questions.length,def=Math.min(20,max);app.innerHTML=`${top('Timed Mode setup')}<main class="wrap"><section class="card"><div class="head"><div><h2>Build your test</h2><p>Choose question count and time.</p></div></div><div class="grid2"><div class="field"><label>Questions</label><input id="count" type="number" min="1" max="${max}" value="${def}"></div><div class="field"><label>Minutes</label><input id="minutes" type="number" min="1" max="600" value="${Math.max(10,def)}"></div></div><div class="actions"><button class="btn primary" data-start>Start test</button></div></section></main>`;document.querySelector('[data-start]').onclick=()=>startTimed(Math.max(1,Math.min(max,+document.getElementById('count').value||def)),Math.max(1,+document.getElementById('minutes').value||def));document.querySelector('[data-home]').onclick=home}
function prep(q){return{...q,ropts:shuffle(q.options.map((text,oi)=>({text,oi})))}}function reset(){S.ans=Array(S.qs.length).fill(null);S.mark=new Set();S.cur=0;S.score=0;S.locked=new Set()}
function startMastery(l){stop();S.mode='mastery';S.level=l;S.qs=S.bank.questions.slice(l*LEVEL,(l+1)*LEVEL).map(prep);reset();workspace()}
function startTimed(count,min){stop();S.mode='timed';S.qs=shuffle(S.bank.questions).slice(0,count).map(prep);S.sec=min*60;reset();workspace();S.timer=setInterval(()=>{S.sec--;const e=document.querySelector('[data-timer]');if(e)e.textContent=fmt(S.sec);if(S.sec<=0){stop();submit(true)}},1000)}
function correct(){return S.ans.reduce((n,a,i)=>n+(a!==null&&S.qs[i].options[a]===S.qs[i].answer),0)}function wrong(){return S.ans.reduce((n,a,i)=>n+(a!==null&&S.qs[i].options[a]!==S.qs[i].answer),0)}
function qhtml(){const q=S.qs[S.cur];return `<div class="qlabel">Question ${S.cur+1}</div><div class="qtext">${esc(q.question)}</div>${q.image?`<img class="qimg" src="${esc(q.image)}" alt="Question image">`:''}`}
function ahtml(){const q=S.qs[S.cur],sel=S.ans[S.cur],lock=S.mode==='mastery'&&S.locked.has(S.cur);let o=q.ropts.map((x,i)=>{let c=sel===x.oi?' sel':'';if(lock){if(q.options[x.oi]===q.answer)c+=' good';else if(sel===x.oi)c+=' bad'}return `<button class="opt${c}" data-opt="${x.oi}" ${lock?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span class="radio"></span><span>${esc(x.text)}</span></button>`}).join('');let f='';if(lock){const good=sel!==null&&q.options[sel]===q.answer;f=`<div class="feedback ${good?'good':'bad'}"><b>${good?'✓ Correct':'✕ Incorrect'}</b>${q.explanation?`<div>${esc(q.explanation)}</div>`:''}${!good?`<div>Correct: ${esc(q.answer)}</div>`:''}</div>`}return `<div class="answer-title"><span>Choose your answer</span><span>${q.options.length} options</span></div><div class="opts">${o}</div>${f}`}
function palette(){return S.qs.map((q,i)=>`<button class="pq ${i===S.cur?'cur':''} ${S.ans[i]!==null?'answered':''} ${S.mark.has(i)?'marked':''}" data-jump="${i}">${i+1}</button>`).join('')}
function side(){return `<div class="sideTop"><b>Q${S.cur+1} / ${S.qs.length}</b><div class="sideActions"><button class="btn" data-mark>${S.mark.has(S.cur)?'Unmark':'Mark'}</button><button class="btn" data-clear>Clear</button></div><div class="mini"><span>✓ ${correct()}</span><span>✕ ${wrong()}</span><span>○ ${S.ans.filter(x=>x===null).length}</span></div></div><div class="palette">${palette()}</div>`}
function workspace(){const timed=S.mode==='timed',extra=timed?`<span class="pill" style="background:#111a31;color:#fff" data-timer>${fmt(S.sec)}</span>`:`<span class="pill">🏆 Mastery</span>`;app.innerHTML=`${top(timed?'Timed Mode':`Mastery • Level ${S.level+1}`,extra)}<div class="mobileTools"><button data-q>Question</button><button data-a>Answers</button><button data-p>☷</button></div><main class="workspace"><section class="pane"><div class="panehead"><b>${esc(S.bank.title)}</b><span>${S.cur+1}/${S.qs.length}</span></div><div class="progress"><i style="width:${(S.cur+1)/S.qs.length*100}%"></i></div><div class="qbox" data-qbox>${qhtml()}</div></section><section class="pane"><div class="abox" data-abox>${ahtml()}</div></section><aside class="side">${side()}</aside></main><footer class="bottom"><button class="btn" data-prev ${S.cur===0?'disabled':''}>← Previous</button><button class="btn primary" data-next>${S.cur===S.qs.length-1?(timed?'Submit':'Finish level'):'Save & Next →'}</button></footer>`;bind()}
function choose(i){if(S.mode==='mastery'&&S.locked.has(S.cur))return;S.ans[S.cur]=i;if(S.mode==='mastery'){S.locked.add(S.cur);if(S.qs[S.cur].options[i]===S.qs[S.cur].answer)S.score++}workspace()}
function bind(){document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>choose(+b.dataset.opt));document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.jump;workspace()});document.querySelector('[data-prev]').onclick=()=>{if(S.cur>0){S.cur--;workspace()}};document.querySelector('[data-next]').onclick=()=>S.cur<S.qs.length-1?(S.cur++,workspace()):submit(false);document.querySelector('[data-mark]').onclick=()=>{S.mark.has(S.cur)?S.mark.delete(S.cur):S.mark.add(S.cur);workspace()};document.querySelector('[data-clear]').onclick=()=>{if(!(S.mode==='mastery'&&S.locked.has(S.cur))){S.ans[S.cur]=null;workspace()}};document.querySelector('[data-home]').onclick=()=>{if(confirm('Exit this attempt?'))home()};document.querySelector('[data-q]').onclick=()=>document.querySelector('[data-qbox]').scrollIntoView({behavior:'smooth'});document.querySelector('[data-a]').onclick=()=>document.querySelector('[data-abox]').scrollIntoView({behavior:'smooth'});document.querySelector('[data-p]').onclick=sheet}
function sheet(){const b=document.createElement('div');b.className='sheetBack';const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="sheetHead"><b>Question navigator</b><button>×</button></div><div class="palette">${palette()}</div>`;document.body.append(b,s);const close=()=>{b.remove();s.remove()};b.onclick=close;s.querySelector('button').onclick=close;s.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>{S.cur=+x.dataset.jump;close();workspace()})}
function submit(auto){if(S.mode==='timed'&&!auto){const u=S.ans.filter(x=>x===null).length;if(u&&!confirm(`${u} unanswered. Submit anyway?`))return}stop();const c=correct(),w=wrong(),u=S.ans.filter(x=>x===null).length,p=Math.round(c/S.qs.length*100);if(S.mode==='mastery'&&c===S.qs.length){const total=Math.ceil(S.bank.questions.length/LEVEL);if(S.level===unlocked()&&S.level<total-1)setUnlocked(S.level+1)}result(c,w,u,p)}
function result(c,w,u,p){const review=S.qs.map((q,i)=>{const a=S.ans[i],g=a!==null&&q.options[a]===q.answer;return `<article class="reviewItem ${g?'good':''}"><h3>${i+1}. ${esc(q.question)}</h3><p><b>Your answer:</b> ${a===null?'Not answered':esc(q.options[a])}</p><p><b>Correct:</b> ${esc(q.answer)}</p>${q.explanation?`<p><b>Explanation:</b> ${esc(q.explanation)}</p>`:''}</article>`}).join('');app.innerHTML=`${top('Results')}<main class="result"><section class="resultHero"><div class="eyebrow" style="color:#dce1ff">Result</div><h1>${p}%</h1><p>${S.mode==='mastery'?(c===S.qs.length?'Perfect. Next level unlocked.':'100% is required to unlock the next level.'):'Review your answers below.'}</p><div class="stats"><div class="stat"><b>${c}</b><span>Correct</span></div><div class="stat"><b>${w}</b><span>Wrong</span></div><div class="stat"><b>${u}</b><span>Unanswered</span></div><div class="stat"><b>${S.qs.length}</b><span>Total</span></div></div><div class="actions">${S.mode==='mastery'?'<button class="btn primary" data-levels>Levels</button><button class="btn" data-retry>Retry</button>':'<button class="btn primary" data-newtimed>New timed test</button>'}</div></section><section class="card"><div class="head"><h2>Review</h2></div><div class="review">${review}</div></section></main>`;if(S.mode==='mastery'){document.querySelector('[data-levels]').onclick=levels;document.querySelector('[data-retry]').onclick=()=>startMastery(S.level)}else document.querySelector('[data-newtimed]').onclick=timedSetup;document.querySelector('[data-home]').onclick=home}
load();
})();
</script>
</body>
</html>
